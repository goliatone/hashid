# Make sure to check the documentation at http://goreleaser.com
version: 2
project_name: hashid
before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod download
    # you may remove this if you don't need go generate
    # - go generate ./...
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      # - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
    main: "./cmd/hashid/main.go"
    binary: "hashid"
    ldflags:
      - >-
        -s -w
        -X github.com/goliatone/hashid/pkg/version.Tag={{ .Version }}
        -X github.com/goliatone/hashid/pkg/version.Time={{ .Date }}
        -X github.com/goliatone/hashid/pkg/version.User=goreleaser
        -X github.com/goliatone/hashid/pkg/version.Commit={{ .FullCommit }}
archives:
  - id: hashid
    name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^Update README"
      - "merge fix"
  format: '{{ .SHA }}: {{ .Message }} ({{ with .AuthorUsername }}@{{ . }}{{ else }}{{ .AuthorName }} <{{ .AuthorEmail }}>{{ end }})'
homebrew_casks:
  - name: hashid
    binaries:
      - hashid
    repository:
      owner: goliatone
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    description: deterministic globally unique identifiers.
    homepage: https://github.com/goliatone/hashid
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/hashid"]
          end
nfpms:
  - id: hashid
    file_name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    bindir: /usr/local/bin/
    maintainer: goliatone <hashid@goliatone.com>
    description: deterministic globally unique identifiers.
    homepage: https://github.com/goliatone/hashid
    license: "MIT"
    formats:
      - deb
      - rpm
